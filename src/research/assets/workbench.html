<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<title>投資リサーチ</title>
<style>
:root{color-scheme:light;--bg:#f6f8fc;--fg:#182b44;--line:#d8e0eb;--panel:#fff;--muted:#536379;--blue:#245bd0;--button-ink:#fff}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111a27;--fg:#e7eef9;--line:#35455c;--panel:#182334;--muted:#b1bfd2;--blue:#a4bfff;--button-ink:#111a27}}
:root[data-theme=light]{color-scheme:light;--bg:#f6f8fc;--fg:#182b44;--line:#d8e0eb;--panel:#fff;--muted:#536379;--blue:#245bd0;--button-ink:#fff}
:root[data-theme=dark]{color-scheme:dark;--bg:#111a27;--fg:#e7eef9;--line:#35455c;--panel:#182334;--muted:#b1bfd2;--blue:#a4bfff;--button-ink:#111a27}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Yu Gothic UI","Meiryo",system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;position:relative;z-index:4}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0;white-space:nowrap}button,select{font:inherit;border:1px solid var(--line);border-radius:5px;padding:7px 10px;background:var(--panel);color:var(--fg);min-height:36px;max-width:100%}button{cursor:pointer}button.primary{background:var(--blue);color:var(--button-ink);border-color:var(--blue);font-weight:600}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid var(--blue);outline-offset:2px}#status,#scope-label{font-size:12px;color:var(--muted)}#status{margin:3px 0 0;line-height:1.5}#status.failed{color:#ba553b}iframe{display:block;border:0;width:100%;flex:1 1 auto;min-height:0;background:var(--panel)}details>summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-size:14px;color:var(--muted)}.settings{position:absolute;right:12px;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;width:min(440px,calc(100vw - 24px));box-shadow:0 8px 24px #0002;max-height:65dvh;overflow:auto}.settings label{display:block;margin:10px 0 4px}.settings p{color:var(--muted);font-size:14px}.settings>button{width:100%}#view{font-size:14px}
@media(max-width:600px){header{padding:8px 12px}.toolbar{gap:8px}h1{font-size:18px}#scope-label{display:none}.toolbar>button{min-height:40px}#view{padding:7px 8px}.toolbar>details{margin-left:auto}}
</style></head>
<body><header><div class="toolbar"><h1>投資リサーチ</h1><span id="scope-label">日米まとめて</span><label for="update-mode">更新内容</label><select id="update-mode"><option value="prices">市場・価格</option><option value="fundamentals">業績データ</option><option value="all">市場・価格＋業績</option></select><button id="update" class="primary" disabled>市場・価格を更新</button><button id="view">保存結果を表示</button>
<details id="update-settings"><summary>更新設定</summary><div class="settings"><label for="scope">対象</label><select id="scope"><option value="all">日米まとめて</option><option value="JP">日本だけ</option><option value="US">米国だけ</option></select><label for="profile">取得</label><select id="profile"><option value="standard">標準</option><option value="advanced">研究詳細（旧方式）</option></select><p>市場・価格は地合い・業種・テーマ・候補を更新。業績は無料データを銘柄ごとに取得し、7日以内の取得済み分を再利用します。一次資料の確認日は自動更新しません。個別銘柄の深掘りはCodexへ銘柄名を指定してください。</p><p>Codexでこのプロジェクトを選び「投資更新」と依頼しても同じ処理を使えます。個別株・資料・企業価値の観測日はそれぞれの保存時点です。</p></div></details></div>
<p id="status" role="status" aria-live="polite">保存結果を読み込んでいます。</p>
</header><iframe id="dashboard" src="/dashboard" title="投資リサーチ分析画面"></iframe>
<script>
const token='<!--TOKEN-->',update=document.getElementById('update'),scope=document.getElementById('scope'),status=document.getElementById('status'),frame=document.getElementById('dashboard');let revision=null,polling=false,appearance='auto';
function showStatus(data){update.disabled=data.running;scope.disabled=data.running;document.getElementById('profile').disabled=data.running;document.getElementById('update-mode').disabled=data.running;const message=data.running||data.result==='failed'?data.message:data.result==='saved'?'保存結果':data.result==='partial'?'更新完了 / 一部未取得':'更新完了';if(status.textContent!==message)status.textContent=message;status.title=data.message;status.className=data.result==='failed'?'failed':'';if(revision!==null&&revision!==data.revision)frame.src='/dashboard?revision='+data.revision;revision=data.revision;}
async function poll(){if(polling)return;polling=true;try{const res=await fetch('/api/status');if(!res.ok)throw Error();showStatus(await res.json());}catch{status.textContent='ローカル入口に接続できません。起動ファイルをもう一度開いてください。保存済み画面の操作は続けられます。';}finally{polling=false;}}
update.onclick=async()=>{update.disabled=true;status.textContent='更新を依頼しています。';try{const res=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json','X-Research-Token':token},body:JSON.stringify({scope:scope.value,profile:document.getElementById('profile').value,mode:document.getElementById('update-mode').value})});if(!res.ok&&res.status!==409)throw Error();await poll();}catch{status.textContent='更新を開始できませんでした。以前の表示を維持しています。';update.disabled=false;}};
document.getElementById('update-mode').onchange=e=>{update.textContent=e.target.selectedOptions[0].textContent+'を更新';if(e.target.value!=='prices')document.getElementById('profile').value='standard';};document.getElementById('profile').onchange=e=>{if(e.target.value==='advanced'){document.getElementById('update-mode').value='prices';update.textContent='市場・価格を更新';}};
document.getElementById('view').onclick=()=>{frame.src='/dashboard?view='+Date.now();poll();};scope.onchange=()=>{document.getElementById('scope-label').textContent=scope.selectedOptions[0].textContent;};
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin||event.data?.type!=='research-appearance'||!['auto','light','dark'].includes(event.data.theme))return;appearance=event.data.theme;document.documentElement.dataset.theme=appearance;});
frame.addEventListener('load',()=>frame.contentWindow.postMessage({type:'research-appearance',theme:appearance},location.origin));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('update-settings').open=false;});poll();setInterval(poll,2000);
</script></body></html>
