[tool.ruff]
# Exclude commonly ignored directories.
cache-dir = ".states/ruff_cache"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".venv_rebuild",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
cache_dir = ".states/pytest_cache"
addopts = "--basetemp=.states/pytest_tmp"
markers = [
    "contract: external provider, serialization, storage, or configuration contract",
    "integration: multi-module service, state, or persistence integration",
    "slow: deterministic test excluded from the local quick profile",
]

[tool.coverage.run]
branch = true
source = ["src", "frontend"]
data_file = ".states/.coverage"

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 62

[tool.mypy]
python_version = "3.12"
cache_dir = ".states/mypy_cache"
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
