name: Quality and deploy

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Read-only release checks with coverage
        run: python scripts/check.py --coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            .states/.coverage
            .states/coverage.json
            .states/coverage_html/
          if-no-files-found: warn
          retention-days: 14

  sync-to-hub:
    name: Push to Hugging Face Spaces
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is not configured"
            exit 1
          fi

          deploy_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "${deploy_dir}"

          cd "${deploy_dir}"
          rm -rf docs/ui-audit

          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy to Hugging Face Spaces"
          git push --force "https://shusuke12345:${HF_TOKEN}@huggingface.co/spaces/shusuke12345/AI-investing-app" main
