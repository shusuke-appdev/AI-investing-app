name: Quality and deploy

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      staging_acceptance:
        description: Staging action after the quality gate
        required: true
        default: quality-only
        type: choice
        options:
          - quality-only
          - deploy
          - rollback-exercise
      staging_confirmation:
        description: Type STAGING:<owner/name> for a staging deploy
        required: false
        type: string

concurrency:
  group: quality-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install pip==25.3 setuptools==82.0.1 wheel==0.48.0
          python -m pip install -r requirements-dev-lock.txt

      - name: Read-only release checks with coverage
        run: python scripts/check.py --coverage

      - name: Install Chromium for responsive UI smoke
        run: python -m playwright install --with-deps chromium

      - name: Responsive browser UI smoke
        run: python scripts/ui_browser_smoke.py

      - name: Build and smoke Docker image
        run: |
          set -euo pipefail

          image="ai-investing-app:${GITHUB_SHA}"
          mkdir -p .states
          docker build --tag "${image}" .
          container_id="$(docker run --detach \
            --publish 7860:7860 \
            "${image}")"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" || true
          }
          trap cleanup EXIT

          status="000"
          for attempt in $(seq 1 24); do
            status="$(curl --silent --output .states/docker-health.json \
              --write-out '%{http_code}' --max-time 5 \
              http://127.0.0.1:7860/_health || true)"
            if [ "${status}" = "200" ] && \
              python -c "import json; assert json.load(open('.states/docker-health.json'))['status'] is True"; then
              echo "Docker health check passed."
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "${container_id}" | grep -q true; then
              echo "::error::Docker container exited before becoming healthy"
              exit 1
            fi
            echo "Attempt ${attempt}/24 returned HTTP ${status}; waiting for startup."
            sleep 10
          done

          echo "::error::Docker health check failed (HTTP ${status})"
          exit 1

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.run_id }}
          path: |
            .states/.coverage
            .states/coverage.json
            .states/coverage_html/
          if-no-files-found: warn
          retention-days: 14

  sync-to-hub:
    name: Push to Hugging Face Spaces
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: quality
    environment: hugging-face-production
    env:
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO || 'shusuke12345/AI-investing-app' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify private Space before push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          python scripts/verify_hf_deployment.py
          --space "${HF_SPACE_REPO}"
          --require-private
          --preflight-only

      - name: Push to Hugging Face Spaces
        id: deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is not configured"
            exit 1
          fi
          if [ -z "${HF_SPACE_REPO:-}" ]; then
            echo "::error::HF_SPACE_REPO must be configured"
            exit 1
          fi

          hf_owner="${HF_SPACE_REPO%%/*}"
          remote_url="https://${hf_owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          git fetch --no-tags "${remote_url}" refs/heads/main:refs/hf/previous
          previous_commit="$(git rev-parse refs/hf/previous)"
          mkdir -p "${GITHUB_WORKSPACE}/.states"
          {
            echo "github_sha=${GITHUB_SHA}"
            echo "hf_space_repo=${HF_SPACE_REPO}"
            echo "previous_hf_commit=${previous_commit:-none}"
          } > "${GITHUB_WORKSPACE}/.states/hf-deploy-metadata.txt"

          deploy_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "${deploy_dir}"

          cd "${deploy_dir}"
          rm -rf docs/ui-audit

          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy to Hugging Face Spaces"
          deploy_commit="$(git rev-parse HEAD)"
          echo "hf_commit=${deploy_commit}" >> "${GITHUB_OUTPUT}"
          echo "hf_deploy_commit=${deploy_commit}" >> "${GITHUB_WORKSPACE}/.states/hf-deploy-metadata.txt"
          git push --force "${remote_url}" main

      - name: Verify deployed Space
        id: verify
        continue-on-error: true
        timeout-minutes: 17
        env:
          HF_SPACE_READ_TOKEN: ${{ secrets.HF_SPACE_READ_TOKEN }}
        run: >-
          python scripts/verify_hf_deployment.py
          --space "${HF_SPACE_REPO}"
          --expected-sha "${{ steps.deploy.outputs.hf_commit }}"
          --require-private
          --timeout-seconds 900
          --metadata-path .states/hf-deploy-metadata.txt

      - name: Restore previous Space revision after failed verification
        if: steps.verify.outcome == 'failure'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_READ_TOKEN: ${{ secrets.HF_SPACE_READ_TOKEN }}
        run: |
          set -euo pipefail
          hf_owner="${HF_SPACE_REPO%%/*}"
          remote_url="https://${hf_owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          previous_commit="$(git rev-parse refs/hf/previous)"
          git push --force "${remote_url}" "${previous_commit}:refs/heads/main"
          python scripts/verify_hf_deployment.py \
            --space "${HF_SPACE_REPO}" \
            --expected-sha "${previous_commit}" \
            --require-private \
            --timeout-seconds 900 \
            --metadata-path .states/hf-deploy-metadata.txt

      - name: Preserve failed deployment result
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::New Space revision failed verification and was rolled back"
          exit 1

      - name: Upload deployment metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hf-deploy-${{ github.run_id }}
          path: .states/hf-deploy-metadata.txt
          if-no-files-found: warn
          retention-days: 30

  sync-to-hub-staging:
    name: Push to Hugging Face staging Space
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.staging_acceptance != 'quality-only'
    runs-on: ubuntu-latest
    needs: quality
    environment: hugging-face-staging
    env:
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
      HF_STAGING_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
      HF_PRODUCTION_SPACE_REPO: ${{ vars.HF_PRODUCTION_SPACE_REPO }}
      HF_STAGING_ACCEPTANCE_ACK: ${{ vars.HF_STAGING_ACCEPTANCE_ACK }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Enforce isolated staging target
        env:
          STAGING_CONFIRMATION: ${{ inputs.staging_confirmation }}
        run: |
          set -euo pipefail
          if [ "${HF_STAGING_ACCEPTANCE_ACK:-}" != "1" ]; then
            echo "::error::HF_STAGING_ACCEPTANCE_ACK must be 1"
            exit 1
          fi
          if [ -z "${HF_SPACE_REPO:-}" ] || [ -z "${HF_PRODUCTION_SPACE_REPO:-}" ]; then
            echo "::error::Both staging and production Space declarations are required"
            exit 1
          fi
          if [ "${HF_SPACE_REPO}" = "${HF_PRODUCTION_SPACE_REPO}" ]; then
            echo "::error::Staging and production Spaces must be different"
            exit 1
          fi
          if [ "${STAGING_CONFIRMATION:-}" != "STAGING:${HF_SPACE_REPO}" ]; then
            echo "::error::Staging confirmation does not match the target Space"
            exit 1
          fi

      - name: Verify private staging Space before push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          python scripts/verify_hf_deployment.py
          --space "${HF_SPACE_REPO}"
          --require-private
          --preflight-only

      - name: Push to Hugging Face staging Space
        id: staging_deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is not configured"
            exit 1
          fi

          hf_owner="${HF_SPACE_REPO%%/*}"
          remote_url="https://${hf_owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          git fetch --no-tags "${remote_url}" refs/heads/main:refs/hf/staging-previous
          previous_commit="$(git rev-parse refs/hf/staging-previous)"
          mkdir -p "${GITHUB_WORKSPACE}/.states"
          {
            echo "github_sha=${GITHUB_SHA}"
            echo "hf_space_repo=${HF_SPACE_REPO}"
            echo "acceptance_mode=${{ inputs.staging_acceptance }}"
            echo "previous_hf_commit=${previous_commit}"
          } > "${GITHUB_WORKSPACE}/.states/hf-staging-deploy-metadata.txt"

          deploy_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "${deploy_dir}"
          cd "${deploy_dir}"
          rm -rf docs/ui-audit

          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy staging acceptance revision"
          deploy_commit="$(git rev-parse HEAD)"
          echo "hf_commit=${deploy_commit}" >> "${GITHUB_OUTPUT}"
          echo "hf_deploy_commit=${deploy_commit}" >> "${GITHUB_WORKSPACE}/.states/hf-staging-deploy-metadata.txt"
          git push --force "${remote_url}" main

      - name: Verify deployed staging Space
        id: staging_verify
        continue-on-error: true
        timeout-minutes: 17
        env:
          HF_SPACE_READ_TOKEN: ${{ secrets.HF_SPACE_READ_TOKEN }}
          ACCEPTANCE_MODE: ${{ inputs.staging_acceptance }}
        run: |
          set -euo pipefail
          failure_arg=()
          if [ "${ACCEPTANCE_MODE}" = "rollback-exercise" ]; then
            failure_arg=(--staging-force-health-failure)
          fi
          python scripts/verify_hf_deployment.py \
            --space "${HF_SPACE_REPO}" \
            --expected-sha "${{ steps.staging_deploy.outputs.hf_commit }}" \
            --require-private \
            --timeout-seconds 900 \
            --metadata-path .states/hf-staging-deploy-metadata.txt \
            "${failure_arg[@]}"

      - name: Restore previous staging revision after failed verification
        if: steps.staging_verify.outcome == 'failure'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_READ_TOKEN: ${{ secrets.HF_SPACE_READ_TOKEN }}
        run: |
          set -euo pipefail
          hf_owner="${HF_SPACE_REPO%%/*}"
          remote_url="https://${hf_owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          previous_commit="$(git rev-parse refs/hf/staging-previous)"
          git push --force "${remote_url}" "${previous_commit}:refs/heads/main"
          python scripts/verify_hf_deployment.py \
            --space "${HF_SPACE_REPO}" \
            --expected-sha "${previous_commit}" \
            --require-private \
            --timeout-seconds 900 \
            --metadata-path .states/hf-staging-deploy-metadata.txt

      - name: Preserve failed staging deployment result
        if: steps.staging_verify.outcome == 'failure'
        run: |
          echo "::error::Staging revision failed acceptance and was rolled back"
          exit 1

      - name: Upload staging deployment metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hf-staging-deploy-${{ github.run_id }}
          path: .states/hf-staging-deploy-metadata.txt
          if-no-files-found: warn
          retention-days: 30
