name: Quality and deploy

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: quality-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Read-only release checks with coverage
        run: python scripts/check.py --coverage

      - name: Install Chromium for responsive UI smoke
        run: python -m playwright install --with-deps chromium

      - name: Responsive browser UI smoke
        run: python scripts/ui_browser_smoke.py

      - name: Build and smoke Docker image
        run: |
          set -euo pipefail

          image="ai-investing-app:${GITHUB_SHA}"
          mkdir -p .states
          docker build --tag "${image}" .
          container_id="$(docker run --detach \
            --publish 7860:7860 \
            "${image}")"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" || true
          }
          trap cleanup EXIT

          status="000"
          for attempt in $(seq 1 24); do
            status="$(curl --silent --output .states/docker-health.json \
              --write-out '%{http_code}' --max-time 5 \
              http://127.0.0.1:7860/_health || true)"
            if [ "${status}" = "200" ] && \
              python -c "import json; assert json.load(open('.states/docker-health.json'))['status'] is True"; then
              echo "Docker health check passed."
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "${container_id}" | grep -q true; then
              echo "::error::Docker container exited before becoming healthy"
              exit 1
            fi
            echo "Attempt ${attempt}/24 returned HTTP ${status}; waiting for startup."
            sleep 10
          done

          echo "::error::Docker health check failed (HTTP ${status})"
          exit 1

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: |
            .states/.coverage
            .states/coverage.json
            .states/coverage_html/
          if-no-files-found: warn
          retention-days: 14

  sync-to-hub:
    name: Push to Hugging Face Spaces
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: quality
    environment: hugging-face-production
    env:
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO || 'shusuke12345/AI-investing-app' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify private Space before push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          python scripts/verify_hf_deployment.py
          --space "${HF_SPACE_REPO}"
          --require-private
          --preflight-only

      - name: Push to Hugging Face Spaces
        id: deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is not configured"
            exit 1
          fi
          if [ -z "${HF_SPACE_REPO:-}" ]; then
            echo "::error::HF_SPACE_REPO must be configured"
            exit 1
          fi

          hf_owner="${HF_SPACE_REPO%%/*}"
          remote_url="https://${hf_owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          git fetch --no-tags "${remote_url}" refs/heads/main:refs/hf/previous
          previous_commit="$(git rev-parse refs/hf/previous)"
          mkdir -p "${GITHUB_WORKSPACE}/.states"
          {
            echo "github_sha=${GITHUB_SHA}"
            echo "hf_space_repo=${HF_SPACE_REPO}"
            echo "previous_hf_commit=${previous_commit:-none}"
          } > "${GITHUB_WORKSPACE}/.states/hf-deploy-metadata.txt"

          deploy_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "${deploy_dir}"

          cd "${deploy_dir}"
          rm -rf docs/ui-audit

          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy to Hugging Face Spaces"
          deploy_commit="$(git rev-parse HEAD)"
          echo "hf_commit=${deploy_commit}" >> "${GITHUB_OUTPUT}"
          echo "hf_deploy_commit=${deploy_commit}" >> "${GITHUB_WORKSPACE}/.states/hf-deploy-metadata.txt"
          git push --force "${remote_url}" main

      - name: Verify deployed Space
        id: verify
        continue-on-error: true
        timeout-minutes: 17
        env:
          HF_SPACE_READ_TOKEN: ${{ secrets.HF_SPACE_READ_TOKEN }}
        run: >-
          python scripts/verify_hf_deployment.py
          --space "${HF_SPACE_REPO}"
          --expected-sha "${{ steps.deploy.outputs.hf_commit }}"
          --require-private
          --timeout-seconds 900
          --metadata-path .states/hf-deploy-metadata.txt

      - name: Restore previous Space revision after failed verification
        if: steps.verify.outcome == 'failure'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_READ_TOKEN: ${{ secrets.HF_SPACE_READ_TOKEN }}
        run: |
          set -euo pipefail
          hf_owner="${HF_SPACE_REPO%%/*}"
          remote_url="https://${hf_owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          previous_commit="$(git rev-parse refs/hf/previous)"
          git push --force "${remote_url}" "${previous_commit}:refs/heads/main"
          python scripts/verify_hf_deployment.py \
            --space "${HF_SPACE_REPO}" \
            --expected-sha "${previous_commit}" \
            --require-private \
            --timeout-seconds 900 \
            --metadata-path .states/hf-deploy-metadata.txt

      - name: Preserve failed deployment result
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::New Space revision failed verification and was rolled back"
          exit 1

      - name: Upload deployment metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hf-deploy-${{ github.run_id }}
          path: .states/hf-deploy-metadata.txt
          if-no-files-found: warn
          retention-days: 30
